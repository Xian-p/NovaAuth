name: Build NovaAuth

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -U -DskipTests package

      - name: Upload shaded plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: NovaAuth-jar
          path: |
            target/*-all.jar

      - name: Upload project zip (assembly)
        uses: actions/upload-artifact@v4
        with:
          name: NovaAuth-project-zip
          path: |
            target/*.zip
